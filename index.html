<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Reserva de Cita Hospitalaria</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    font-family: Arial, Helvetica, sans-serif;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #e8f7fa,
            #f7fcfd
        );

    color: #263238;
}


.contenedor {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 15px;
}


.tarjeta {

    width: 100%;

    max-width: 850px;

    background: white;

    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.12);
}


.encabezado {

    text-align: center;

    margin-bottom: 30px;
}


.icono {

    font-size: 45px;

    margin-bottom: 10px;
}


h1 {

    color: #087f8c;

    font-size: 32px;

    margin-bottom: 8px;
}


.encabezado p {

    color: #718096;
}


.fila {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;
}


.grupo {

    margin-bottom: 20px;
}


label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: bold;

    color: #37474f;
}


input,
select,
textarea {

    width: 100%;

    padding: 13px 14px;

    border: 1px solid #cbd5e0;

    border-radius: 9px;

    outline: none;

    font-size: 15px;

    font-family: inherit;

    background: white;

    transition: 0.2s;
}


input:focus,
select:focus,
textarea:focus {

    border-color: #087f8c;

    box-shadow:
        0 0 0 3px
        rgba(8, 127, 140, 0.12);
}


select:disabled {

    background: #edf2f7;

    cursor: not-allowed;
}


textarea {

    resize: vertical;

    min-height: 120px;
}


.btn-reservar {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 9px;

    background: #087f8c;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}


.btn-reservar:hover {

    background: #066873;

    transform:
        translateY(-1px);
}


.btn-nueva {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 9px;

    background: #1565c0;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.btn-nueva:hover {

    background: #0d47a1;
}


.mensaje {

    display: none;

    margin-top: 20px;

    padding: 15px;

    border-radius: 9px;

    line-height: 1.6;
}


.mensaje.exito {

    display: block;

    color: #087f5b;

    background: #e6fffa;

    border: 1px solid #9ae6b4;
}


.mensaje.error {

    display: block;

    color: #c53030;

    background: #fff5f5;

    border: 1px solid #feb2b2;
}


.obligatorio {

    color: #e53e3e;
}


.informacion-horario {

    margin-top: 8px;

    padding: 10px;

    border-radius: 7px;

    background: #e3f2fd;

    color: #1565c0;

    font-size: 13px;

    line-height: 1.5;
}


@media (max-width: 650px) {

    .tarjeta {

        padding:
            25px 18px;
    }


    h1 {

        font-size: 26px;
    }


    .fila {

        grid-template-columns: 1fr;

        gap: 0;
    }

}

</style>

</head>


<body>


<div class="contenedor">


<div class="tarjeta">


<!-- ================================= -->
<!-- ENCABEZADO -->
<!-- ================================= -->

<div class="encabezado">

<div class="icono">
🏥
</div>


<h1>
Reserva tu cita
</h1>


<p>
Completa el formulario para reservar
tu cita hospitalaria.
</p>

</div>


<!-- ================================= -->
<!-- FORMULARIO -->
<!-- ================================= -->

<form id="formCita">


<!-- NOMBRE -->

<div class="grupo">

<label for="nombre">

Nombre del paciente

<span class="obligatorio">*</span>

</label>


<input
    type="text"
    id="nombre"
    placeholder="Nombre completo"
    minlength="3"
    maxlength="100"
    required
>

</div>


<!-- ================================= -->
<!-- TELÉFONO Y CORREO -->
<!-- ================================= -->

<div class="fila">


<div class="grupo">

<label for="telefono">

Teléfono

</label>


<input
    type="tel"
    id="telefono"
    placeholder="Ej. 834 123 4567"
    pattern="[0-9 ]{10,13}"
>

</div>


<div class="grupo">

<label for="correo">

Correo electrónico

</label>


<input
    type="email"
    id="correo"
    placeholder="correo@ejemplo.com"
>

</div>


</div>


<!-- ================================= -->
<!-- ÁREA Y ESPECIALISTA -->
<!-- ================================= -->

<div class="fila">


<div class="grupo">

<label for="area">

Área médica

<span class="obligatorio">*</span>

</label>


<select
    id="area"
    required
>

<option value="">

Selecciona un área

</option>


<option value="medicina-general">

Medicina General

</option>


<option value="pediatria">

Pediatría

</option>


<option value="ginecologia">

Ginecología

</option>


<option value="laboratorio">

Laboratorio

</option>


<option value="odontologia">

Odontología

</option>


</select>

</div>


<div class="grupo">

<label for="especialista">

Especialista / Responsable

<span class="obligatorio">*</span>

</label>


<select
    id="especialista"
    required
    disabled
>

<option value="">

Primero selecciona un área

</option>

</select>

</div>


</div>


<!-- ================================= -->
<!-- FECHA Y HORA -->
<!-- ================================= -->

<div class="fila">


<div class="grupo">

<label for="fecha">

Fecha

<span class="obligatorio">*</span>

</label>


<input
    type="date"
    id="fecha"
    required
>


<div class="informacion-horario">

📅 No se permiten fechas pasadas.

</div>

</div>


<div class="grupo">

<label for="hora">

Hora disponible

<span class="obligatorio">*</span>

</label>


<select
    id="hora"
    required
>

<option value="">

Selecciona una hora

</option>


<option value="08:00">

08:00 AM

</option>


<option value="08:30">

08:30 AM

</option>


<option value="09:00">

09:00 AM

</option>


<option value="09:30">

09:30 AM

</option>


<option value="10:00">

10:00 AM

</option>


<option value="10:30">

10:30 AM

</option>


<option value="11:00">

11:00 AM

</option>


<option value="11:30">

11:30 AM

</option>


<option value="12:00">

12:00 PM

</option>


<option value="12:30">

12:30 PM

</option>


<option value="13:00">

01:00 PM

</option>


<option value="13:30">

01:30 PM

</option>


<option value="14:00">

02:00 PM

</option>


<option value="14:30">

02:30 PM

</option>


<option value="15:00">

03:00 PM

</option>


<option value="15:30">

03:30 PM

</option>


<option value="16:00">

04:00 PM

</option>


<option value="16:30">

04:30 PM

</option>


<option value="17:00">

05:00 PM

</option>


<option value="17:30">

05:30 PM

</option>


<option value="18:00">

06:00 PM

</option>

</select>


<div class="informacion-horario">

🕐 Horario de atención:
<strong>08:00 - 18:00</strong>

<br>

⏱️ Citas cada:
<strong>30 minutos</strong>

</div>

</div>


</div>


<!-- ================================= -->
<!-- MOTIVO -->
<!-- ================================= -->

<div class="grupo">

<label for="motivo">

Motivo de la consulta

<span class="obligatorio">*</span>

</label>


<textarea
    id="motivo"
    maxlength="500"
    placeholder="Describe brevemente el motivo de tu consulta..."
    required
></textarea>

</div>


<!-- ================================= -->
<!-- BOTÓN -->
<!-- ================================= -->

<button
    type="submit"
    class="btn-reservar"
>

Reservar cita

</button>


<!-- ================================= -->
<!-- MENSAJE -->
<!-- ================================= -->

<div
    id="mensaje"
    class="mensaje"
></div>


</form>


</div>

</div>


<script>


// ==========================================
// ESPECIALISTAS / RESPONSABLES
// ==========================================

const especialistas = {


    "medicina-general": [

        "Dra. Carmen Flores",

        "Dr. Luis Mendoza",

        "Dra. Laura Martínez"

    ],


    "pediatria": [

        "Dra. Sofía González",

        "Dr. José Ramírez",

        "Dra. Ana López"

    ],


    "ginecologia": [

        "Dra. María López",

        "Dra. Patricia Torres",

        "Dra. Elena García"

    ],


    "laboratorio": [

        "QFB. Roberto Sánchez",

        "QFB. Elena Torres",

        "QFB. Carlos Méndez"

    ],


    "odontologia": [

        "Dra. Paola Jiménez",

        "Dr. Ricardo Mendoza",

        "Dra. Andrea Morales"

    ]

};


// ==========================================
// ELEMENTOS
// ==========================================

const form =
    document.getElementById(
        "formCita"
    );


const area =
    document.getElementById(
        "area"
    );


const especialista =
    document.getElementById(
        "especialista"
    );


const fecha =
    document.getElementById(
        "fecha"
    );


const hora =
    document.getElementById(
        "hora"
    );


const telefono =
    document.getElementById(
        "telefono"
    );


const correo =
    document.getElementById(
        "correo"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


// ==========================================
// OBTENER FECHA LOCAL
// ==========================================

function obtenerFechaLocal() {

    const ahora =
        new Date();


    const año =
        ahora.getFullYear();


    const mes =
        String(
            ahora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            ahora.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${año}-${mes}-${dia}`;

}


// ==========================================
// FECHA MÍNIMA = HOY
// ==========================================

function aplicarFechaMinima() {

    fecha.min =
        obtenerFechaLocal();

}


aplicarFechaMinima();


// ==========================================
// CAMBIAR ESPECIALISTAS
// ==========================================

area.addEventListener(
    "change",
    function() {


        const areaSeleccionada =
            this.value;


        especialista.innerHTML =
            "";


        if (
            !areaSeleccionada
        ) {

            especialista.disabled =
                true;


            especialista.innerHTML =
                `
                <option value="">
                    Primero selecciona un área
                </option>
                `;


            return;

        }


        especialista.disabled =
            false;


        especialista.innerHTML =
            `
            <option value="">
                Selecciona un especialista
            </option>
            `;


        especialistas[
            areaSeleccionada
        ].forEach(
            function(nombre) {


                const opcion =
                    document.createElement(
                        "option"
                    );


                opcion.value =
                    nombre;


                opcion.textContent =
                    nombre;


                especialista.appendChild(
                    opcion
                );

            }
        );

    }
);


// ==========================================
// HORAS DISPONIBLES
// ==========================================

function obtenerHorasDisponibles() {


    const opciones =
        hora.querySelectorAll(
            "option"
        );


    const fechaSeleccionada =
        fecha.value;


    const hoy =
        obtenerFechaLocal();


    const ahora =
        new Date();


    opciones.forEach(
        function(opcion) {


            if (
                !opcion.value
            ) {

                return;

            }


            /*
             * Si la fecha seleccionada
             * es hoy, se ocultan
             * las horas que ya pasaron.
             */

            if (
                fechaSeleccionada ===
                hoy
            ) {


                const partes =
                    opcion.value.split(
                        ":"
                    );


                const horaSeleccionada =
                    parseInt(
                        partes[0],
                        10
                    );


                const minutosSeleccionados =
                    parseInt(
                        partes[1],
                        10
                    );


                const minutosActuales =
                    ahora.getHours() *
                    60 +
                    ahora.getMinutes();


                const minutosCita =
                    horaSeleccionada *
                    60 +
                    minutosSeleccionados;


                opcion.disabled =
                    minutosCita <=
                    minutosActuales;


            } else {

                opcion.disabled =
                    false;

            }

        }
    );


    /*
     * Si la hora actualmente
     * seleccionada ya no está
     * disponible, se limpia.
     */

    if (
        hora.selectedOptions[0] &&
        hora.selectedOptions[0].disabled
    ) {

        hora.value =
            "";

    }

}


// ==========================================
// ACTUALIZAR HORAS AL CAMBIAR FECHA
// ==========================================

fecha.addEventListener(
    "change",
    function() {


        const hoy =
            obtenerFechaLocal();


        /*
         * Seguridad adicional:
         * nunca permitir fecha pasada.
         */

        if (
            this.value < hoy
        ) {

            mensaje.className =
                "mensaje error";


            mensaje.innerHTML =
                `
                ❌ No puedes seleccionar
                una fecha pasada.
                `;


            mensaje.style.display =
                "block";


            this.value =
                "";


            return;

        }


        mensaje.style.display =
            "none";


        obtenerHorasDisponibles();

    }
);


// ==========================================
// VALIDAR HORA
// ==========================================

function validarHora() {


    if (
        !fecha.value ||
        !hora.value
    ) {

        return true;

    }


    const hoy =
        obtenerFechaLocal();


    /*
     * Si es hoy, comprobar
     * que la hora todavía
     * no haya pasado.
     */

    if (
        fecha.value === hoy
    ) {


        const ahora =
            new Date();


        const partes =
            hora.value.split(
                ":"
            );


        const horas =
            parseInt(
                partes[0],
                10
            );


        const minutos =
            parseInt(
                partes[1],
                10
            );


        const minutosActuales =
            ahora.getHours() *
            60 +
            ahora.getMinutes();


        const minutosCita =
            horas * 60 +
            minutos;


        if (
            minutosCita <=
            minutosActuales
        ) {

            return false;

        }

    }


    return true;

}


hora.addEventListener(
    "change",
    function() {


        if (
            !validarHora()
        ) {


            mensaje.className =
                "mensaje error";


            mensaje.innerHTML =
                `
                ❌ La hora seleccionada
                ya no está disponible.
                Por favor selecciona
                otra hora.
                `;


            mensaje.style.display =
                "block";


            hora.value =
                "";


        } else {

            mensaje.style.display =
                "none";

        }

    }
);


// ==========================================
// VALIDAR TELÉFONO O CORREO
// ==========================================

function validarContacto() {


    const tieneTelefono =
        telefono.value.trim() !== "";


    const tieneCorreo =
        correo.value.trim() !== "";


    return (
        tieneTelefono ||
        tieneCorreo
    );

}


// ==========================================
// VALIDAR DATOS
// ==========================================

function validarDatos() {


    const nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    if (
        nombre.length < 3
    ) {

        return (
            "El nombre debe contener al menos 3 caracteres."
        );

    }


    if (
        !validarContacto()
    ) {

        return (
            "Debes proporcionar un teléfono o un correo electrónico."
        );

    }


    if (
        !area.value
    ) {

        return (
            "Debes seleccionar un área médica."
        );

    }


    if (
        !especialista.value
    ) {

        return (
            "Debes seleccionar un especialista."
        );

    }


    if (
        !fecha.value
    ) {

        return (
            "Debes seleccionar una fecha."
        );

    }


    if (
        !hora.value
    ) {

        return (
            "Debes seleccionar una hora."
        );

    }


    if (
        !validarHora()
    ) {

        return (
            "La hora seleccionada ya pasó. Elige otra."
        );

    }


    return null;

}


// ==========================================
// FORMATEAR FECHA
// ==========================================

function formatearFecha(
    fechaTexto
) {


    const partes =
        fechaTexto.split(
            "-"
        );


    return (
        `${partes[2]}/` +
        `${partes[1]}/` +
        `${partes[0]}`
    );

}


// ==========================================
// GENERAR FOLIO
// ==========================================

function generarFolio() {


    const fechaActual =
        new Date();


    const año =
        fechaActual.getFullYear();


    const numero =
        Math.floor(
            100000 +
            Math.random() *
            900000
        );


    return (
        `HOSP-${año}-${numero}`
    );

}


// ==========================================
// RESERVAR CITA
// ==========================================

form.addEventListener(
    "submit",
    function(event) {


        event.preventDefault();


        /*
         * ACTUALIZAR HORARIOS
         */

        obtenerHorasDisponibles();


        /*
         * VALIDAR DATOS
         */

        const error =
            validarDatos();


        if (error) {


            mensaje.className =
                "mensaje error";


            mensaje.innerHTML =
                `
                ❌ ${error}
                `;


            mensaje.style.display =
                "block";


            return;

        }


        /*
         * OBTENER DATOS
         */

        const nombre =
            document.getElementById(
                "nombre"
            ).value.trim();


        const areaTexto =
            area.options[
                area.selectedIndex
            ].text;


        const especialistaTexto =
            especialista.value;


        const fechaTexto =
            fecha.value;


        const horaTexto =
            hora.value;


        const motivo =
            document.getElementById(
                "motivo"
            ).value.trim();


        const folio =
            generarFolio();


        /*
         * FORMATEAR FECHA
         */

        const fechaFormateada =
            formatearFecha(
                fechaTexto
            );


        /*
         * MOSTRAR CONFIRMACIÓN
         */

        mensaje.className =
            "mensaje exito";


        mensaje.innerHTML =
            `
            <strong>
                ✅ ¡Cita reservada correctamente!
            </strong>

            <br><br>

            <strong>
                Folio:
            </strong>

            ${folio}

            <br>

            <strong>
                Paciente:
            </strong>

            ${nombre}

            <br>

            <strong>
                Área:
            </strong>

            ${areaTexto}

            <br>

            <strong>
                Especialista:
            </strong>

            ${especialistaTexto}

            <br>

            <strong>
                Fecha:
            </strong>

            ${fechaFormateada}

            <br>

            <strong>
                Hora:
            </strong>

            ${horaTexto}

            <br>

            <strong>
                Motivo:
            </strong>

            ${motivo}

            <br><br>

            <button
                type="button"
                class="btn-nueva"
                id="nuevaCita"
            >
                ➕ Registrar nueva cita
            </button>
            `;


        mensaje.style.display =
            "block";


        /*
         * DESACTIVAR FORMULARIO
         * HASTA REGISTRAR NUEVA CITA
         */

        const elementos =
            form.querySelectorAll(
                "input, select, textarea, button"
            );


        elementos.forEach(
            function(elemento) {

                elemento.disabled =
                    true;

            }
        );


        /*
         * CREAR BOTÓN NUEVA CITA
         */

        document
            .getElementById(
                "nuevaCita"
            )
            .addEventListener(
                "click",
                reiniciarFormulario
            );


        /*
         * IR AL MENSAJE
         */

        mensaje.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });


        /*
         * MOSTRAR DATOS EN CONSOLA
         */

        console.log({

            folio: folio,

            paciente: nombre,

            telefono:
                telefono.value,

            correo:
                correo.value,

            area:
                areaTexto,

            especialista:
                especialistaTexto,

            fecha:
                fechaTexto,

            hora:
                horaTexto,

            motivo:
                motivo

        });

    }
);


// ==========================================
// REINICIAR FORMULARIO
// ==========================================

function reiniciarFormulario() {


    /*
     * REINICIAR CAMPOS
     */

    form.reset();


    /*
     * REACTIVAR ELEMENTOS
     */

    const elementos =
        form.querySelectorAll(
            "input, select, textarea, button"
        );


    elementos.forEach(
        function(elemento) {

            elemento.disabled =
                false;

        }
    );


    /*
     * ESPECIALISTA DESACTIVADO
     */

    especialista.disabled =
        true;


    especialista.innerHTML =
        `
        <option value="">
            Primero selecciona un área
        </option>
        `;


    /*
     * RESTABLECER FECHA MÍNIMA
     */

    aplicarFechaMinima();


    /*
     * LIMPIAR MENSAJE
     */

    mensaje.className =
        "mensaje";


    mensaje.innerHTML =
        "";


    mensaje.style.display =
        "none";


    /*
     * SUBIR AL FORMULARIO
     */

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// ==========================================
// ACTUALIZAR HORAS AUTOMÁTICAMENTE
// ==========================================

setInterval(
    function() {


        if (
            fecha.value ===
            obtenerFechaLocal()
        ) {

            obtenerHorasDisponibles();

        }

    },
    60000
);


</script>
